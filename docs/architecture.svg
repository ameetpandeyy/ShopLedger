<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Browser UI calls server.js, which mounts four API routers. Routers use library modules, configuration, and the JSON data store. The highlighted order flow is numbered from UI through persistence.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #556070; }
      .group { font-size: 14px; font-weight: 700; letter-spacing: .4px; fill: #374151; }
      .node { fill: #ffffff; stroke: #8b96a6; stroke-width: 1.5; rx: 8; }
      .router { fill: #eef6ff; stroke: #5d93c8; stroke-width: 1.5; rx: 8; }
      .lib { fill: #f8fafc; stroke: #9aa6b6; stroke-width: 1.2; rx: 6; }
      .ticket { fill: #fff1e5; stroke: #d97706; stroke-width: 2.2; rx: 6; }
      .data { fill: #effbf3; stroke: #49966a; stroke-width: 1.7; rx: 8; }
      .label { font-size: 14px; font-weight: 700; }
      .small { font-size: 12px; fill: #4b5563; }
      .tiny { font-size: 12px; fill: #5b6472; }
      .connector { stroke: #667085; stroke-width: 1.35; fill: none; marker-end: url(#arrow); }
      .flow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#flowArrow); }
      .dashed { stroke-dasharray: 5 4; }
      .step { fill: #2563eb; }
      .stepText { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f7f9fc"/>
  <text x="36" y="38" class="title">ShopLedger architecture</text>
  <text x="36" y="60" class="subtitle">Node/Express POS, Khata ledger, inventory, GST invoicing • numbered arrows show order placement</text>

  <!-- Browser and app entry -->
  <text x="48" y="104" class="group">CLIENT</text>
  <rect x="44" y="116" width="190" height="112" class="node"/>
  <text x="60" y="145" class="label">Browser UI</text>
  <text x="60" y="168" class="small">public/index.html</text>
  <text x="60" y="188" class="small">public/js/app.js</text>
  <text x="60" y="208" class="small">public/css/style.css</text>

  <text x="303" y="104" class="group">APPLICATION ENTRY</text>
  <rect x="294" y="116" width="194" height="112" class="node"/>
  <text x="310" y="145" class="label">server.js</text>
  <text x="310" y="168" class="small">Express + JSON middleware</text>
  <text x="310" y="188" class="small">static public/ • mounts /api</text>
  <text x="310" y="208" class="small">GET /orders/:id/invoice</text>

  <path d="M234 172 H294" class="flow"/>
  <circle cx="260" cy="158" r="11" class="step"/><text x="260" y="158" class="stepText">1</text>
  <text x="248" y="195" class="tiny">POST /api/orders</text>

  <!-- Routers -->
  <text x="540" y="104" class="group">ROUTES (mounted under /api)</text>
  <rect x="530" y="116" width="190" height="70" class="router"/>
  <text x="546" y="143" class="label">routes/products.js</text>
  <text x="546" y="165" class="small">GET products, coupons</text>
  <rect x="742" y="116" width="205" height="70" class="router"/>
  <text x="758" y="143" class="label">routes/orders.js</text>
  <text x="758" y="165" class="small">GET/POST orders • cancel</text>
  <rect x="530" y="202" width="190" height="70" class="router"/>
  <text x="546" y="229" class="label">routes/customers.js</text>
  <text x="546" y="251" class="small">GET customers • settle</text>
  <rect x="742" y="202" width="205" height="70" class="router"/>
  <text x="758" y="229" class="label">routes/reports.js</text>
  <text x="758" y="251" class="small">dashboard • reconciliation • preview</text>
  <path d="M488 151 H530" class="connector"/>
  <path d="M488 172 H742" class="flow"/>
  <circle cx="688" cy="157" r="11" class="step"/><text x="688" y="157" class="stepText">2</text>
  <text x="619" y="190" class="tiny">POST /orders handler</text>

  <!-- Config and storage -->
  <text x="1000" y="104" class="group">SETTINGS &amp; DATA</text>
  <rect x="984" y="116" width="170" height="70" class="node"/>
  <text x="1000" y="143" class="label">config.js</text>
  <text x="1000" y="165" class="small">shop • tax • inventory • coupons</text>
  <rect x="984" y="202" width="170" height="70" class="data"/>
  <text x="1000" y="229" class="label">data/db.json</text>
  <text x="1000" y="251" class="small">products • orders • customers</text>

  <!-- libraries -->
  <text x="48" y="314" class="group">LIBRARY MODULES</text>
  <rect x="44" y="328" width="192" height="68" class="lib"/>
  <text x="58" y="354" class="label">lib/store.js</text>
  <text x="58" y="376" class="small">read() • write() • appendAudit()</text>
  <rect x="254" y="328" width="192" height="68" class="lib"/>
  <text x="268" y="354" class="label">lib/orders.js</text>
  <text x="268" y="376" class="small">add() • get() • cancel() • list()</text>
  <rect x="464" y="328" width="192" height="68" class="lib"/>
  <text x="478" y="354" class="label">lib/inventory.js</text>
  <text x="478" y="376" class="small">check() • reserve() • release()</text>
  <rect x="674" y="328" width="192" height="68" class="lib"/>
  <text x="688" y="354" class="label">lib/pricing.js</text>
  <text x="688" y="376" class="small">subtotal() • computeTotals()</text>
  <rect x="884" y="328" width="270" height="68" class="ticket"/>
  <text x="898" y="354" class="label">lib/tax.js  •  ticket focus</text>
  <text x="898" y="376" class="small">getRateForItem() • splitCgstSgst()</text>

  <rect x="44" y="416" width="192" height="68" class="lib"/>
  <text x="58" y="442" class="label">lib/coupons.js</text>
  <text x="58" y="464" class="small">validate() • calculateDiscount()</text>
  <rect x="254" y="416" width="192" height="68" class="lib"/>
  <text x="268" y="442" class="label">lib/ledger.js</text>
  <text x="268" y="464" class="small">chargeOrderToKhata() • settlement</text>
  <rect x="464" y="416" width="192" height="68" class="ticket"/>
  <text x="478" y="442" class="label">lib/invoice.js  • ticket focus</text>
  <text x="478" y="464" class="small">computeInvoiceFigures() • render()</text>
  <rect x="674" y="416" width="192" height="68" class="lib"/>
  <text x="688" y="442" class="label">lib/reports.js</text>
  <text x="688" y="464" class="small">getDashboardSummary() • GST recon</text>
  <rect x="884" y="416" width="270" height="68" class="lib"/>
  <text x="898" y="442" class="label">lib/dates.js</text>
  <text x="898" y="464" class="small">today() • normalizeDateKey() • fiscal year</text>

  <!-- structural edges -->
  <path d="M760 186 V306 H140 V328" class="connector"/>
  <path d="M760 186 V306 H350 V328" class="connector"/>
  <path d="M760 186 V306 H560 V328" class="connector"/>
  <path d="M760 186 V306 H770 V328" class="connector"/>
  <path d="M760 186 V306 H1018 V328" class="connector"/>
  <path d="M720 151 H984" class="connector dashed"/>
  <path d="M236 362 H984" class="connector"/>
  <path d="M984 362 V272" class="connector"/>
  <path d="M488 228 V416" class="connector dashed"/>
  <path d="M947 237 H984" class="connector dashed"/>

  <!-- Numbered order flow band -->
  <rect x="44" y="532" width="1110" height="206" fill="#eef5ff" stroke="#9dc1ee" stroke-width="1.3" rx="10"/>
  <text x="62" y="560" class="group" fill="#1d4ed8">ORDER PLACEMENT FLOW — POST /api/orders</text>
  <path d="M132 610 H238" class="flow"/><path d="M346 610 H454" class="flow"/><path d="M562 610 H670" class="flow"/><path d="M778 610 H886" class="flow"/><path d="M994 610 H1100" class="flow"/>
  <circle cx="82" cy="610" r="15" class="step"/><text x="82" y="610" class="stepText">1</text>
  <text x="108" y="605" class="label">UI</text><text x="108" y="625" class="small">posts cart payload</text>
  <circle cx="296" cy="610" r="15" class="step"/><text x="296" y="610" class="stepText">2</text>
  <text x="322" y="605" class="label">orders route</text><text x="322" y="625" class="small">resolves product lines</text>
  <circle cx="512" cy="610" r="15" class="step"/><text x="512" y="610" class="stepText">3</text>
  <text x="538" y="605" class="label">inventory.check()</text><text x="538" y="625" class="small">uses stock − reserved</text>
  <circle cx="728" cy="610" r="15" class="step"/><text x="728" y="610" class="stepText">4</text>
  <text x="754" y="605" class="label">pricing + coupons + tax</text><text x="754" y="625" class="small">computes totals</text>
  <circle cx="944" cy="610" r="15" class="step"/><text x="944" y="610" class="stepText">5</text>
  <text x="970" y="605" class="label">Khata + stock</text><text x="970" y="625" class="small">charge; reserve()</text>
  <circle cx="1094" cy="610" r="15" class="step"/><text x="1094" y="610" class="stepText">6</text>
  <text x="1060" y="655" class="label">orders.add()</text><text x="1041" y="675" class="small">audit + store.write()</text>
  <path d="M512 640 V686 H560 V484" class="flow"/>
  <path d="M728 640 V686 H1018 V396" class="flow"/>
  <path d="M944 640 V686 H350 V484" class="flow"/>
  <path d="M1094 640 V686 H140 V396" class="flow"/>
  <path d="M140 396 V712 H1068" class="flow"/>
  <text x="62" y="718" class="small">Persisted result: products.stock, customer Khata totals when applicable, orders[], nextOrderId, auditLog → data/db.json</text>

  <!-- legend -->
  <rect x="44" y="756" width="1110" height="28" fill="#ffffff" stroke="#d2d8e2" rx="5"/>
  <rect x="58" y="763" width="14" height="14" class="router"/><text x="79" y="775" class="tiny">Router</text>
  <rect x="150" y="763" width="14" height="14" class="lib"/><text x="171" y="775" class="tiny">Library module</text>
  <rect x="300" y="763" width="14" height="14" class="ticket"/><text x="321" y="775" class="tiny">Ticket focus: invoice/tax</text>
  <rect x="495" y="763" width="14" height="14" class="data"/><text x="516" y="775" class="tiny">Persisted data</text>
  <line x1="647" y1="770" x2="685" y2="770" class="flow"/><text x="698" y="775" class="tiny">Numbered order flow</text>
  <line x1="863" y1="770" x2="901" y2="770" class="connector dashed"/><text x="914" y="775" class="tiny">Supporting dependency</text>
</svg>
